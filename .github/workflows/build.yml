# Builds the launcher on GitHub's own Windows machines every time you upload changes.
# The finished exe appears under the "Actions" tab (open the run, then "Artifacts") and is attached to this repository's release.
# It is attached automatically when:
#   - you publish a release (any tag name), or push a tag
#   - you run this workflow by hand (Actions > Build > Run workflow) and type a release's tag name
name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag of the release to attach the exe to (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the launcher
        shell: pwsh
        env:
          RELEASE_BUILD: 'true'
          # Google Drive sign-in for Cloud Save (src/GoogleDrive.cs): repository secrets, never in the code
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # the compiler's messages also become annotations of the run, so a failed build says why
          cmd /c build.bat 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern "error|Missing file" | ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $code
          }

      - name: Keep the exe as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: Azeroth-Survivors-Launcher
          path: |
            dist/Azeroth Survivors Launcher.exe
            dist/Azeroth Survivors Launcher.sha256.txt

      - name: Attach the exe to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          # A push to main publishes the version named at the top of the launcher changelog.
          if [ -z "$TAG" ]; then TAG="$(head -n 1 assets/launcher-changelog.txt | awk '{print $2}')"; fi
          if [ -z "$TAG" ]; then echo "::error::Could not determine the release tag from the launcher changelog"; exit 1; fi
          # each version is its own release, with its notes from release-notes/<tag>.md when there is one
          notes="release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "Azeroth Survivors Launcher $TAG" > /tmp/notes.md; notes=/tmp/notes.md; }
          # a failing command's message becomes an annotation of the run
          run() { "$@" 2>/tmp/err.txt || { echo "::error::$(head -c 900 /tmp/err.txt | tr '\n' ' ')"; exit 1; }; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            run gh release edit "$TAG" --title "Azeroth Survivors Launcher $TAG" --notes-file "$notes"
          else
            run gh release create "$TAG" --title "Azeroth Survivors Launcher $TAG" --notes-file "$notes" --latest
          fi
          # the checksum file, made here too when the build did not leave one
          [ -f "dist/Azeroth Survivors Launcher.sha256.txt" ] || (cd dist && sha256sum "Azeroth Survivors Launcher.exe" > "Azeroth Survivors Launcher.sha256.txt")
          files=("dist/Azeroth Survivors Launcher.exe" "dist/Azeroth Survivors Launcher.sha256.txt")
          run gh release upload "$TAG" "${files[@]}" --clobber
