# Developer tool: builds assets/item-models.txt ("Item name|item id|display id") for real class gear, jewelry and Transmog looks
# from the CMaNGOS Classic world database (https://github.com/cmangos/classic-db), so Guide hovers can show item models
# from Wowhead's model viewer host. Also checks which picture address
# Wowhead serves. Puts the file on the private "item-models" branch. Run by hand: Actions > Item models.
name: Item models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the items
        run: |
          git clone -q --depth 1 https://github.com/cmangos/classic-db.git /tmp/db || echo "::error::clone failed"
          f=$(ls /tmp/db/Full_DB/*.sql* | head -1)
          case "$f" in
            *.gz) zcat "$f" > /tmp/world.sql ;;
            *.zip) unzip -p "$f" > /tmp/world.sql ;;
            *.7z) 7z x -so "$f" > /tmp/world.sql ;;
            *) cp "$f" /tmp/world.sql ;;
          esac
          python3 tools/gear_names.py assets/items.txt > /tmp/gear-names.txt
          python3 tools/jewelry_names.py assets/items.txt > /tmp/jewelry-names.txt
          python3 tools/item_models.py assets/transmog.txt /tmp/gear-names.txt /tmp/jewelry-names.txt < /tmp/world.sql > /tmp/raw-items.txt || echo "::error::parse failed"
          python3 tools/verify_item_models.py /tmp/raw-items.txt > /tmp/items.txt
          echo "::notice::found $(wc -l < /tmp/items.txt) real gear, jewelry and look items: $(cut -d'|' -f1 /tmp/items.txt | tr '\n' ';')"
          { echo "# Item label|model source item id|display id, gear, jewelry and Transmog from the CMaNGOS Classic world"
            echo "# database (https://github.com/cmangos/classic-db); same-set slot synonyms are used where AZS uses a different slot noun."
            echo "# Only items with an available Wowhead Classic JPG or PNG model thumbnail are included."
            cat /tmp/items.txt; } > /tmp/item-models.txt
      - name: Which picture address works
        run: |
          first=$(grep -v '^#' /tmp/item-models.txt | head -1)
          d=$(echo "$first" | cut -d'|' -f3); i=$(echo "$first" | cut -d'|' -f2)
          [ -z "$d" ] && exit 0
          m=$((d % 256))
          for u in "https://wow.zamimg.com/modelviewer/classic/webthumbs/item/$m/$d.jpg" \
                   "https://wow.zamimg.com/modelviewer/classic/webthumbs/item/$m/$d.png" \
                   "https://wow.zamimg.com/modelviewer/classic/webthumbs/item/$m/$d.webp" \
                   "https://wow.zamimg.com/modelviewer/live/webthumbs/item/$m/$d.jpg" \
                   "https://wow.zamimg.com/modelviewer/live/webthumbs/item/$m/$d.png" \
                   "https://wow.zamimg.com/modelviewer/live/webthumbs/item/$m/$d.webp" \
                   "https://wow.zamimg.com/modelviewer/classic/meta/item/$i.json"; do
            c=$(curl -s -o /tmp/p -w '%{http_code} %{content_type} %{size_download}' -A "Mozilla/5.0" "$u")
            echo "::notice::$c $u"
          done
      - name: Keep it on the item-models branch
        run: |
          mkdir /tmp/pub && cp /tmp/item-models.txt /tmp/pub/ && cd /tmp/pub
          git init -q -b item-models && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "item models"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:item-models
