# Downloads every addon listed in addons/sources.txt from its original link (or zips the ones kept in this
# repository) and keeps a copy on the "addons"
# release of this repository, so players can download all addons from GitHub.
# Runs by itself when addons/sources.txt changes, or by hand: Actions > Mirror addons > Run workflow.
name: Mirror addons

on:
  push:
    branches: [main]
    paths: ['addons/**', '.github/workflows/mirror-addons.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the addons and put them on the "addons" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Slimmy25/Azeroth-Survivors-Launcher
        run: |
          set -euo pipefail
          # a pre-release, so it never counts as the "latest" release (that one is the launcher)
          gh release view addons >/dev/null 2>&1 || \
            gh release create addons --prerelease --title "Addons" \
              --notes "Copies of the addons offered in the launcher's Download More list. Each addon belongs to its author (see the file name)."
          mkdir -p mirror
          grep -v '^[[:space:]]*#' addons/sources.txt | grep '|' > list.txt
          while IFS='|' read -r file url; do
            file="$(echo "$file" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            url="$(echo "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            case "$url" in
              hosted)                                    # kept on the "addons" release itself: nothing to download
                if ! gh release view addons --json assets --jq '.assets[].name' | grep -qx "$file"; then
                  echo "::error::$file is marked hosted but is not on the addons release"; exit 1
                fi
                echo "Keeping $file (hosted on the addons release)"
                continue
                ;;
              local:*)                                   # an addon kept in this repository: zip its folder
                folders="${url#local:}"
                echo "Zipping addons/$folders as $file"
                IFS='+' read -ra parts <<< "$folders"
                (cd addons && zip -qr "../mirror/$file" "${parts[@]}")
                ;;
              github-bundle-latest:*)                    # combine matching ZIP assets from multiple latest releases
                # "github-bundle-latest:<owner>/<repo>:<prefix>+..." bundles one matching ZIP from each repo.
                spec="${url#github-bundle-latest:}"
                stage="$(mktemp -d)"
                trap 'rm -rf "$stage"' EXIT
                IFS='+' read -ra sources <<< "$spec"
                mkdir -p "$stage/package"
                index=0
                for source in "${sources[@]}"; do
                  repo="${source%%:*}"; prefix="${source#*:}"
                  if [ "$source" = "$repo" ]; then prefix=""; fi
                  zipurl="$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/releases/latest" \
                            | jq -r --arg p "$prefix" '[.assets[] | select((.name | test("\\.zip$"; "i")) and (.name | startswith($p)))][0].browser_download_url')"
                  if [ -z "$zipurl" ] || [ "$zipurl" = "null" ]; then echo "::error::$repo has no matching .zip in its latest release"; exit 1; fi
                  archive="$stage/source-$index.zip"
                  unpack="$stage/unpack-$index"
                  mkdir -p "$unpack"
                  index=$((index + 1))
                  echo "Downloading bundle component from $repo: $zipurl"
                  curl -fsSL --retry 3 -A "AzerothSurvivorsLauncher/1.0" -o "$archive" "$zipurl"
                  python3 - "$archive" "$unpack" <<'PY'
          import pathlib, sys, zipfile
          archive, target = sys.argv[1:]
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  name = item.filename.replace('\\', '/')
                  path = pathlib.PurePosixPath(name)
                  if not name or path.is_absolute() or (path.parts and ':' in path.parts[0]) or any(part in ('..', '') for part in path.parts):
                      raise SystemExit(f"unsafe path in addon ZIP: {item.filename}")
              zf.extractall(target)
          PY
                  cp -a "$unpack"/. "$stage/package/"
                done
                (cd "$stage/package" && zip -qr "$GITHUB_WORKSPACE/mirror/$file" .)
                rm -rf "$stage"
                trap - EXIT
                ;;
              github-latest:*)                           # the newest release's .zip of a GitHub repository
                # "github-latest:<owner>/<repo>:<prefix>" takes only a .zip whose name starts with <prefix>
                spec="${url#github-latest:}"; repo="${spec%%:*}"; prefix=""
                if [ "$spec" != "$repo" ]; then prefix="${spec#*:}"; fi
                zipurl="$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/releases/latest" \
                          | jq -r --arg p "$prefix" '[.assets[] | select((.name | test("\\.zip$"; "i")) and (.name | startswith($p)))][0].browser_download_url')"
                if [ -z "$zipurl" ] || [ "$zipurl" = "null" ]; then echo "::error::$repo has no .zip${prefix:+ starting with $prefix} in its latest release"; exit 1; fi
                echo "Downloading $file from $zipurl (latest release of $repo)"
                curl -fsSL --retry 3 -A "AzerothSurvivorsLauncher/1.0" -o "mirror/$file" "$zipurl"
                ;;
              *)
                echo "Downloading $file from $url"
                curl -fsSL --retry 3 -A "AzerothSurvivorsLauncher/1.0" -o "mirror/$file" "$url"
                ;;
            esac
            if ! unzip -tq "mirror/$file" > /dev/null; then
              echo "::error::$file ($url) is not a valid .zip"
              exit 1
            fi
            unzip -l "mirror/$file" | tail -1
          done < list.txt
          ls mirror/*.zip >/dev/null 2>&1 && gh release upload addons mirror/*.zip --clobber
          # addons taken off the list: their old copies go too (named one by one)
          for old in DoomWithin-by-tna0y-vladvis.zip AS-Time-Tracker-by-Slimjim.zip DBM-by-Gabriellus.zip Death-Recap-by-Fotze.zip Chest-GPS-by-Fotze.zip; do
            if [ ! -f "mirror/$old" ] && gh release view addons --json assets --jq '.assets[].name' | grep -qx "$old"; then
              echo "Removing $old"; gh release delete-asset addons "$old" -y
            fi
          done
          echo "Done:"
          gh release view addons --json assets --jq '.assets[] | .name + "  " + (.size|tostring)'
